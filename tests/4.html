<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pixel Perfect Ellipse Motion</title>

<style>
body{background:#111;color:#ddd;font-family:monospace}
canvas{background:#000;border:1px solid #444;image-rendering:pixelated}
input[type="range"] {
  width: 1000px; /* or whatever length you want */
}
</style>
</head>

<body>

Rotation
<input id="rot" type="range" min="0" max="360" step="0.1" value="0">
<span id="rv">0</span>°

<br><br>

<canvas id="c"></canvas>

<script>

const W=160,H=120,P=4

const canvas=document.getElementById("c")
const ctx=canvas.getContext("2d")

canvas.width=W*P
canvas.height=H*P
ctx.imageSmoothingEnabled=false

function drawPixel(x,y){
 if(x>=0&&y>=0&&x<W&&y<H)
  ctx.fillRect(x*P,y*P,P,P)
}

/* Bresenham */

function line(x0,y0,x1,y1,arr){

 let dx=Math.abs(x1-x0)
 let dy=Math.abs(y1-y0)

 let sx=x0<x1?1:-1
 let sy=y0<y1?1:-1

 let err=dx-dy

 while(true){

  arr.push({x:x0,y:y0})

  if(x0===x1 && y0===y1) break

  let e2=err*2

  if(e2>-dy){err-=dy;x0+=sx}
  if(e2< dx){err+=dx;y0+=sy}

 }

}

/* build ellipse */

function buildEllipse(cx,cy,a,b,angle){

 let pixels=[]

 let s=Math.sin(angle)
 let c=Math.cos(angle)

 /* implicit ellipse error */

 let A=(c*c)/(a*a)+(s*s)/(b*b)
 let B=2*c*s*(1/(a*a)-1/(b*b))
 let C=(s*s)/(a*a)+(c*c)/(b*b)

 function err(x,y){
  return Math.abs(A*x*x+B*x*y+C*y*y-1)
 }

 /* dense sampling */

 let step=1/(Math.max(a,b)*8)

 let prev=null

 for(let t=0;t<Math.PI*2;t+=step){

  let ct=Math.cos(t)
  let st=Math.sin(t)

  let xf=a*ct
  let yf=b*st

  let xr=xf*c-yf*s
  let yr=xf*s+yf*c

  let ix=Math.round(xr)
  let iy=Math.round(yr)

  /* best pixel in 3x3 */

  let bestx=ix
  let besty=iy
  let best=err(ix,iy)

  for(let dx=-1;dx<=1;dx++)
  for(let dy=-1;dy<=1;dy++){

   let x=ix+dx
   let y=iy+dy

   let e=err(x,y)

   if(e<best){
    best=e
    bestx=x
    besty=y
   }

  }

  let x=cx+bestx
  let y=cy+besty

  if(prev){

   let dx=Math.abs(x-prev.x)
   let dy=Math.abs(y-prev.y)

   if(dx>1||dy>1)
    line(prev.x,prev.y,x,y,pixels)
   else
    pixels.push({x,y})

  }
  else pixels.push({x,y})

  prev={x,y}

 }

 /* remove duplicates but keep order */

 let seen=new Set()
 let out=[]

 for(let p of pixels){

  let k=p.x+","+p.y

  if(!seen.has(k)){
   seen.add(k)
   out.push(p)
  }

 }

 return out

}

/* state */

let pixels=[]
let pos=0
let angle=0

function rebuild(){
 pixels=buildEllipse(W/2|0,H/2|0,50,80,angle*Math.PI/180)
}

/* draw */

function draw(){

 ctx.clearRect(0,0,canvas.width,canvas.height)

 ctx.fillStyle="#064"

 for(let p of pixels)
  drawPixel(p.x,p.y)

 if(pixels.length){

  let p=pixels[pos]

  ctx.fillStyle="#0f8"
  drawPixel(p.x,p.y)

 }

}

/* animation */

function frame(){

 angle=+rot.value/2.0

 rv.textContent=angle.toFixed(1)

 rebuild()

 if(pixels.length)
  pos=(pos+1)%pixels.length

 draw()

 requestAnimationFrame(frame)

}

requestAnimationFrame(frame)

</script>
</body>
</html>
