<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>Ellipse Pixel Array Arc Demo</title>
<style>
body{background:#111;color:#ddd;font-family:monospace}
canvas{background:#000;border:1px solid #444;image-rendering:pixelated}
input[type="range"] {
  width: 1000px; /* or whatever length you want */
}
</style>
</head>

<body>

Rotation <input id="rot" type="range" min="0" max="360" step="0.1" value="0"> <span id="rv">0</span>°

<br>

Arc start <input id="start" type="range" min="0" max="360" value="0"> <span id="sv">0</span>°

<br>

Arc end <input id="end" type="range" min="0" max="360" value="360"> <span id="ev">360</span>°

<br><br>

<canvas id="c"></canvas>

<script>

const W=160,H=120,P=4

const canvas=document.getElementById("c")
const ctx=canvas.getContext("2d")

canvas.width=W*P
canvas.height=H*P
ctx.imageSmoothingEnabled=false

function drawPixel(x,y){
 if(x>=0&&y>=0&&x<W&&y<H)
  ctx.fillRect(x*P,y*P,P,P)
}

/* Bresenham pushing pixels */
function lineToArray(x0,y0,x1,y1,t,arr){

 let dx=Math.abs(x1-x0)
 let dy=Math.abs(y1-y0)

 let sx=x0<x1?1:-1
 let sy=y0<y1?1:-1

 let err=dx-dy

 while(true){

  arr.push({x:x0,y:y0,t})

  if(x0===x1 && y0===y1) break

  let e2=2*err

  if(e2>-dy){ err-=dy; x0+=sx }
  if(e2< dx){ err+=dx; y0+=sy }

 }

}

/* Build ellipse pixel array */
function buildEllipse(cx,cy,a,b,angle){

 let pixels=[]

 let s=Math.sin(angle)
 let c=Math.cos(angle)

 let A=(c*c)/(a*a)+(s*s)/(b*b)
 let B=2*c*s*(1/(a*a)-1/(b*b))
 let C=(s*s)/(a*a)+(c*c)/(b*b)

 function err(x,y){
  return Math.abs(A*x*x+B*x*y+C*y*y-1)
 }

 let step=1/Math.max(a,b)

 let prevx=null
 let prevy=null

 for(let t=0;t<Math.PI*2;t+=step){

  let ct=Math.cos(t)
  let st=Math.sin(t)

  let xf=a*ct
  let yf=b*st

  let xr=xf*c-yf*s
  let yr=xf*s+yf*c

  let ix=Math.floor(xr)
  let iy=Math.floor(yr)

  let bestx=ix
  let besty=iy
  let best=err(ix,iy)

  let candidates=[
   [ix+1,iy],
   [ix,iy+1],
   [ix+1,iy+1]
  ]

  for(let p of candidates){
   let e=err(p[0],p[1])
   if(e<best){
    best=e
    bestx=p[0]
    besty=p[1]
   }
  }

  let x=cx+bestx
  let y=cy+besty

  if(prevx!==null){

   let dx=Math.abs(x-prevx)
   let dy=Math.abs(y-prevy)

   if(dx>1 || dy>1){
    lineToArray(prevx,prevy,x,y,t,pixels)
   }else{
    pixels.push({x,y,t})
   }

  }else{
   pixels.push({x,y,t})
  }

  prevx=x
  prevy=y

 }

 return pixels
}

/* Draw arc using stored parametric angle */
function drawArc(pixels,startDeg,endDeg){

 let s=startDeg*Math.PI/180
 let e=endDeg*Math.PI/180

 for(let p of pixels){

  let t=p.t

  if(s<=e){
   if(t>=s && t<=e) drawPixel(p.x,p.y)
  }else{
   if(t>=s || t<=e) drawPixel(p.x,p.y)
  }

 }

}

let pixels=[]
let angle=0

function rebuild(){
 pixels=buildEllipse(W/2|0,H/2|0,50,80,angle*Math.PI/180)
}

function draw(){

 ctx.clearRect(0,0,canvas.width,canvas.height)

 ctx.fillStyle="#0f8"

 drawArc(pixels,+start.value,+end.value)

}

function frame(){

 angle=+rot.value
 rv.textContent=angle

 sv.textContent=start.value
 ev.textContent=end.value

 rebuild()
 draw()

 requestAnimationFrame(frame)

}

requestAnimationFrame(frame)

</script>

</body>
</html>
